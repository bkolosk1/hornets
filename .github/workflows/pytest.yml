name: Run Pytests

on:
  push:
    paths:
      - 'hornets/**'
      - 'tests/**'
  pull_request:
    paths:
      - 'hornets/**'
      - 'tests/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Install Python
      run: uv python install 3.11

    - name: Install dependencies
      run: uv sync

    - name: Run Pytest
      run: |
        uv run pytest tests/
