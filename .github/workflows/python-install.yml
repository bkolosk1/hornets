name: Test Installation

on:
  push:
    paths:
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'uv.lock'

jobs:
  test-installation:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Install Python
      run: uv python install 3.11

    - name: Install dependencies
      run: uv sync

    - name: Verify installation
      run: |
        uv run python -c "import hornets; print('Module imported successfully')"
