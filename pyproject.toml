[project]
name = "hornets"
version = "0.1.1"
description = "HorNets: Learning from Discrete and Continuous Signals with Routing Neural Networks"
authors = [
    {name = "bkolosk1", email = "bosec99@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "scikit-learn>=1.6.1,<2.0.0",
    "torch>=2.5.1",
    "torchvision>=0.20.1",
    "torchaudio>=2.5.1",
    "tqdm>=4.67.1,<5.0.0",
    "numpy>=1.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
]
